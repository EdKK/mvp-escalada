<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>MVP Escalada — Entrada</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182438; background: #F5F7FB; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    .card { width: 100%; max-width: 500px; padding: 36px 28px; text-align: center; background: #fff; border: 1px solid #dce4f0; border-radius: 24px; box-shadow: 0 12px 40px #123e7810; }
    .brand { margin: 0 0 28px; color: #123E78; font-size: 16px; font-weight: 700; letter-spacing: .2px; }
    .result-icon { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 24px; background: #e5f5eb; color: #22A052; }
    .result-icon svg { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    body[data-result="failure"] .result-icon { color: #ab4338; background: #fff0ed; }
    h1 { margin: 0 0 16px; font-size: 30px; line-height: 1.2; letter-spacing: -.7px; overflow-wrap: break-word; }
    .instruction { margin: 0 0 28px; font-size: 19px; line-height: 1.6; }
    button { width: 100%; min-height: 58px; border: 0; border-radius: 13px; background: #1769F5; color: white; font: inherit; font-size: 19px; font-weight: 700; padding: 16px 20px; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, a:focus-visible { outline: 3px solid #8ab8ff; outline-offset: 4px; }
    .fallback { border-top: 1px solid #e4eaf3; padding-top: 22px; margin: 26px 0 0; font-size: 18px; line-height: 1.6; color: #52627a; }
    .fallback strong { color: #182438; }
    .recovery { margin: 20px 0 0; font-size: 18px; line-height: 1.6; }
    .recovery a { color: #1769F5; text-underline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 360px) { .card { padding: 30px 20px; } h1 { font-size: 28px; } }
  </style>
</head>
<body data-result="@@RESULT@@">
  <main>
    <section class="card" aria-labelledby="result-title">
      <p class="brand">MVP Escalada</p>
      <div class="result-icon" aria-hidden="true"><svg viewBox="0 0 48 48">@@ICON@@</svg></div>
      <h1 id="result-title">@@TITLE@@</h1>
      <p class="instruction">@@INSTRUCTION@@</p>
      <button id="return-button" type="button">Voltar ao MVP</button>
      <p class="fallback" id="return-help" role="status" aria-live="polite">@@FALLBACK@@</p>
      <p class="recovery" @@RECOVERY_HIDDEN@@><a href="@@APP_URL@@" target="_top" rel="noreferrer">Fechei a aba original: iniciar nova entrada</a></p>
    </section>
  </main>
  <script>
    // Returning means closing this callback tab, never reloading the original tab:
    // the original tab holds the OAuth completion proof only in memory.
    (function () {
      function returnToOriginalTab() {
        try { window.top.close(); } catch (e) { /* Sandbox or browser may block closing. */ }
        try { window.close(); } catch (e) { /* Manual tab switching remains available. */ }
        document.getElementById('return-help').textContent = 'Se esta tela continuar aberta, use o seletor de abas do Safari ou do seu navegador para voltar à aba original do MVP Escalada. Não recarregue essa aba; siga a instrução acima.';
      }
      document.getElementById('return-button').addEventListener('click', returnToOriginalTab);
      if (document.body.dataset.result === 'success') setTimeout(returnToOriginalTab, 4000);
    })();
  </script>
</body>
</html>
